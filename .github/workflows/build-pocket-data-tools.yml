name: Pocket game-data tools

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Select Windows native compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: Add-Content $env:GITHUB_PATH "$env:MSYS2_LOCATION\ucrt64\bin"
      - name: Test real converters and data preparation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python src/openfpga/tests/test_prepare_game.py
      - name: Build converters without the SDK
        run: python src/openfpga/tools/prepare_game.py --build-tools
      - name: Assemble a standalone preparation bundle
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import shutil
          import subprocess
          import platform
          port = Path('src/openfpga')
          bundle = port/'out/preparation-bundle'
          shutil.copytree(port/'out/data-tools', bundle/'bin')
          shutil.copy2(port/'tools/prepare_game.py', bundle/'prepare_game.py')
          shutil.copy2(port/'GAME-DATA.md', bundle/'GAME-DATA.md')
          shutil.copy2('LICENSE', bundle/'LICENSE')
          subprocess.run(['git', 'archive', '--format=tar.gz', '-o', str(bundle/'source.tar.gz'), 'HEAD'], check=True)
          kind = 'zip' if platform.system() == 'Windows' else 'gztar'
          shutil.make_archive(str(port/'out'/('pocket-data-tools-'+platform.system()+'-'+platform.machine())), kind, root_dir=bundle)
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-data-tools-${{ runner.os }}-${{ runner.arch }}
          path: src/openfpga/out/pocket-data-tools-*
          if-no-files-found: error
