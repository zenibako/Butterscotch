name: Pocket game-data tools

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/openfpga/tools/pocket-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/openfpga/tools/pocket-data/go.mod
          cache-dependency-path: src/openfpga/tools/pocket-data/go.sum
      - name: Test native, WASI and Extism conversion
        run: go test ./...
      - name: Check Go code
        run: go vet ./...
      - name: Build standalone tool and bundle
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          bundle=out/bundle
          mkdir -p "$bundle/licenses"
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=".exe"; fi
          go build -trimpath -o "$bundle/prepare-data$suffix" ./cmd/prepare-data
          cp ../../GAME-DATA.md "$bundle/"
          cp ../../../../LICENSE "$bundle/"
          cp third_party/licenses/go.txt "$bundle/licenses/"
          for dep in oggvorbis vorbis; do
            depdir=$(go list -m -f '{{.Dir}}' "github.com/jfreymuth/$dep")
            cp "$depdir/LICENSE" "$bundle/licenses/$dep.txt"
          done
          git archive --format=tar.gz -o "$PWD/$bundle/source.tar.gz" HEAD
          tar -czf "out/pocket-data-tools-$RUNNER_OS-$RUNNER_ARCH.tar.gz" -C "$bundle" .
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-data-tools-${{ runner.os }}-${{ runner.arch }}
          path: src/openfpga/tools/pocket-data/out/pocket-data-tools-*
          if-no-files-found: error
  wasm-and-cross-builds:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/openfpga/tools/pocket-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: src/openfpga/tools/pocket-data/go.mod
          cache-dependency-path: src/openfpga/tools/pocket-data/go.sum
      - name: Install pinned WASM compilers
        shell: bash
        run: |
          curl -fL -o "$RUNNER_TEMP/tinygo.tar.gz" https://github.com/tinygo-org/tinygo/releases/download/v0.43.0/tinygo0.43.0.linux-amd64.tar.gz
          echo "ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a  $RUNNER_TEMP/tinygo.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tinygo.tar.gz" -C "$RUNNER_TEMP"
          curl -fL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Test plugin with both Pocket Sync mount orders
        env:
          REQUIRE_PLUGIN_TESTS: '1'
        run: go test ./integration -run TestExtismPlugin -v
      - name: Test patched Vorbis decoder
        run: go test -C third_party/vorbis ./...
      - name: Check patched Ogg page reader
        run: go vet -C third_party/oggvorbis ./...
      - name: Cross-build standalone tools
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            target_os=${target%/*}
            target_arch=${target#*/}
            suffix=""
            if [ "$target_os" = windows ]; then suffix=".exe"; fi
            GOOS=$target_os GOARCH=$target_arch go build -trimpath -o "out/prepare-data-$target_os-$target_arch$suffix" ./cmd/prepare-data
          done
      - name: Build WASI CLI and Pocket Sync plugin
        env:
          CGO_ENABLED: '0'
          GOOS: wasip1
          GOARCH: wasm
        run: |
          go build -trimpath -o out/prepare-data.wasm ./cmd/prepare-data
          tinygo build -p 2 -trimpath -target wasip1 -buildmode=c-shared -o out/plugin.wasm ./cmd/pocket-plugin
      - name: Include plugin metadata and licenses
        shell: bash
        run: |
          cp plugin.json out/
          cp ../../../../LICENSE out/
          cp ../../GAME-DATA.md out/
          mkdir -p out/licenses
          cp third_party/licenses/*.txt out/licenses/
          for module in github.com/jfreymuth/oggvorbis github.com/jfreymuth/vorbis github.com/extism/go-pdk; do
            depdir=$(go list -m -f '{{.Dir}}' "$module")
            cp "$depdir/LICENSE" "out/licenses/${module##*/}.txt"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: pocket-data-portable-builds
          path: src/openfpga/tools/pocket-data/out/*
          if-no-files-found: error
